name: Collect WoW Retail News
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/weekly.yml'
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wow-weekly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate retail news filters
        run: python -m unittest discover -s tests -v
      - name: Collect and optionally translate
        run: python scripts/collect.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
      - name: Commit weekly archives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly WoW retail news snapshot"
            git push
          fi