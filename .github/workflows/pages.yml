name: Deploy Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect WoW Retail News']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify published news assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=Path('dist/data/latest.json')
          index=Path('dist/data/history/index.json')
          assert latest.is_file(), 'Missing deployed latest.json'
          assert index.is_file(), 'Missing deployed history index'
          data=json.loads(latest.read_text(encoding='utf-8'))
          history=json.loads(index.read_text(encoding='utf-8'))
          assert isinstance(data.get('items'),list), 'Invalid news items'
          assert isinstance(history.get('weeks'),list), 'Invalid history weeks'
          print('Validated deployment:',len(data['items']),'articles,',len(history['weeks']),'weeks')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4