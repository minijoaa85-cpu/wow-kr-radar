name: Deploy Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect WoW Retail News']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install PDF and PowerPoint libraries
        run: python -m pip install 'reportlab>=4,<5' 'python-pptx>=1,<2'
      - name: Generate release history downloads
        run: python scripts/build_release_reports.py
      - run: npm run build
      - name: Verify published news assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=Path('dist/data/latest.json')
          index=Path('dist/data/history/index.json')
          assert latest.is_file(), 'Missing deployed latest.json'
          assert index.is_file(), 'Missing deployed history index'
          kr=Path('dist/data/kr_mplus.json')
          assert kr.is_file(), 'Missing KR Mythic+ status data'
          krdata=json.loads(kr.read_text(encoding='utf-8'))
          assert krdata.get('status') in ('live','unavailable','not_collected'), 'Invalid KR Mythic+ state'
          releases=Path('dist/data/releases.json')
          assert releases.is_file(), 'Missing release history index'
          records=json.loads(releases.read_text(encoding='utf-8'))['entries']
          for release in records:
            for ext in ('pdf','pptx'):
              file=Path(f"dist/reports/WoW_KR_Radar_v{release['version']}_History.{ext}")
              assert file.is_file() and file.stat().st_size>1000, f'Missing report: {file}'
          data=json.loads(latest.read_text(encoding='utf-8'))
          history=json.loads(index.read_text(encoding='utf-8'))
          assert isinstance(data.get('items'),list), 'Invalid news items'
          assert isinstance(history.get('weeks'),list), 'Invalid history weeks'
          print('Validated deployment:',len(data['items']),'articles,',len(history['weeks']),'weeks')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4